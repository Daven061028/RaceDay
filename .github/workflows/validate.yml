name: RaceDay Part 1 Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check required files
        run: |
          echo "Checking required files..."

          if [ ! -f "README.md" ]; then
            echo "❌ README.md is missing"
            exit 1
          fi

          if [ ! -f "docs/RaceDay_ERD.png" ]; then
            echo "❌ docs/RaceDay_ERD.png is missing"
            exit 1
          fi

          if [ ! -f "docs/API_Endpoint_Plan.md.docx" ]; then
            echo "❌ docs/API_Endpoint_Plan.md.docx is missing"
            exit 1
          fi

          if [ ! -f "docs/RaceDay_Database.sql" ]; then
            echo "❌ docs/RaceDay_Database.sql is missing"
            exit 1
          fi

          echo "✅ All required RaceDay Part 1 files are present!"

      - name: Validation successful
        run: echo "✅ RaceDay Part 1 validation completed successfully."
